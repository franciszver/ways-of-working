# profile-claude-code.yaml — Claude-Code-only frontmatter keys, layered
# onto canonical skills/**/SKILL.md by scripts/build-profile.py.
#
# skills/ stays spec-portable (Agent Skills spec keys only). A key a
# skill needs only in Claude Code (argument-hint, disable-model-invocation,
# context, agent, user-invocable, model, effort) belongs here, not in
# skills/.
#
# Format: skill name -> mapping of extra frontmatter keys to merge in.
# scripts/build-profile.py validates this file (allowed keys only, no
# collision with the canonical frontmatter, names must be canonical
# skills) and generates build/claude-code/skills/ from it; `--check`
# verifies the committed build tree is current.
#
# `context: fork` is deliberately not used yet: its interaction with
# agents/*.md that already preload the same skill is unverified (it may
# require an explicit `agent:` and could nest forks). Follow-up once
# checked in a live session — see CONTRIBUTING.md.

deep-review:
  argument-hint: "[file|dir|branch|PR]"

sec-audit:
  argument-hint: "[diff|path]"

research-codebase:
  argument-hint: "<question>"

declutter:
  argument-hint: "[file|dir|branch]"

ci-triage:
  argument-hint: "[run-url|branch]"

migrate:
  argument-hint: "<package@version|target>"
  disable-model-invocation: true

onboard:
  argument-hint: "<module|repo>"

perf:
  argument-hint: "<target>"

incident:
  disable-model-invocation: true

postmortem:
  disable-model-invocation: true

release:
  disable-model-invocation: true

demo-video:
  disable-model-invocation: true
