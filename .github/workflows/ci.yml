name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check install.sh syntax
        run: bash -n install.sh

      - name: shellcheck (if available)
        run: |
          if command -v shellcheck >/dev/null 2>&1 || sudo apt-get install -y shellcheck; then
            shellcheck install.sh
          else
            echo "shellcheck unavailable, skipping"
          fi

      - name: Port parity check
        run: python3 scripts/check_parity.py .

      - name: SKILL.md frontmatter check
        run: python3 scripts/check-frontmatter.py .

      - name: README skill-count check
        run: python3 scripts/check-counts.py .

      - name: Plugin hooks generation check
        run: |
          python3 scripts/merge-hooks.py --emit-plugin > hooks/plugin-hooks.json
          git diff --exit-code hooks/plugin-hooks.json

      - name: Cache Claude Code CLI
        id: cache-claude-code
        uses: actions/cache@v4
        with:
          path: ~/.npm-global
          key: claude-code-cli-2.1.270

      - name: Install Claude Code
        run: |
          npm config set prefix ~/.npm-global
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [ "${{ steps.cache-claude-code.outputs.cache-hit }}" != "true" ]; then
            npm install -g @anthropic-ai/claude-code@2.1.270
          fi

      - name: Validate plugin manifest
        # `claude plugin validate .` can require an authenticated session
        # in some CI environments. Do not treat that as a hard CI failure
        # until this is confirmed against GitHub Actions runners.
        continue-on-error: true
        run: claude plugin validate . --strict
