name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: pip install pyyaml pytest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Plugin version bump check
        # Plugin installs only update on a version bump (see
        # CONTRIBUTING.md's Releasing section). pull_request-only: a push
        # to a long-lived branch has no single base to diff against.
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "$GITHUB_BASE_REF" --depth=1
          changed="$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD")"
          echo "Changed files:"
          echo "$changed"
          if ! echo "$changed" | grep -qE '^(skills|agents|hooks|build|scripts/profile-claude-code\.yaml|scripts/build-profile\.py)(/|$)'; then
            echo "No skills/, agents/, hooks/, build/, or profile-generator changes — no version bump required."
            exit 0
          fi
          if ! echo "$changed" | grep -qx '\.claude-plugin/plugin\.json'; then
            echo "FAIL: skills/, agents/, or hooks/ changed without bumping .claude-plugin/plugin.json's version." >&2
            exit 1
          fi
          if git cat-file -e "origin/$GITHUB_BASE_REF:.claude-plugin/plugin.json" 2>/dev/null; then
            old_version="$(git show "origin/$GITHUB_BASE_REF:.claude-plugin/plugin.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
            new_version="$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')"
            if [ "$old_version" = "$new_version" ]; then
              echo "FAIL: plugin.json changed but version is still $old_version." >&2
              exit 1
            fi
            echo "plugin.json version bumped: $old_version -> $new_version"
          else
            echo "plugin.json is new on this branch — counts as the version bump."
          fi

      - name: install.sh guarded-block tests
        # Also checks install.sh's syntax (bash -n) as its first step.
        run: bash scripts/test-install.sh

      - name: shellcheck (if available)
        run: |
          if command -v shellcheck >/dev/null 2>&1 || sudo apt-get install -y shellcheck; then
            shellcheck install.sh scripts/*.sh
          else
            echo "shellcheck unavailable, skipping"
          fi

      - name: Port parity check
        run: python3 scripts/check_parity.py .

      - name: Antigravity workflow / AGENTS.md drift check
        # These are generated from skills/*/SKILL.md frontmatter; a skill
        # description change must regenerate them (scripts/gen-ports.py).
        run: python3 scripts/gen-ports.py . --check

      - name: Claude Code profile drift check
        # build/claude-code/ is committed, like the antigravity stubs and
        # hooks/plugin-hooks.json. --check regenerates in memory only (no
        # writes) and compares against the committed tree checked out
        # above, so it actually gates drift — it must run before anything
        # in this job could write to build/claude-code/ and mask it.
        run: python3 scripts/build-profile.py . --check

      - name: SKILL.md frontmatter check
        run: python3 scripts/check-frontmatter.py .

      - name: README skill-count check
        run: python3 scripts/check-counts.py .

      - name: Agent frontmatter check
        run: python3 scripts/check-agents.py .

      - name: Skill closing-section and duplication check
        run: python3 scripts/check-skill-sections.py .

      - name: Skill dangling-reference check
        run: python3 scripts/check-references.py

      - name: Plugin hooks generation check
        run: |
          python3 scripts/merge-hooks.py --emit-plugin > hooks/plugin-hooks.json
          git diff --exit-code hooks/plugin-hooks.json

      - name: Cache Claude Code CLI
        id: cache-claude-code
        uses: actions/cache@v4
        with:
          path: ~/.npm-global
          key: claude-code-cli-2.1.270

      - name: Install Claude Code
        run: |
          npm config set prefix ~/.npm-global
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [ "${{ steps.cache-claude-code.outputs.cache-hit }}" != "true" ]; then
            npm install -g @anthropic-ai/claude-code@2.1.270
          fi

      - name: Validate plugin manifest and components
        # `claude plugin validate .` only validates marketplace.json when
        # both .claude-plugin/marketplace.json and plugin.json are present
        # (this repo ships both) — it does not also check plugin.json,
        # skills/, or agents/, so each is validated explicitly. Verified to
        # pass offline, with no authenticated session, so this is a hard
        # gate (no continue-on-error).
        run: |
          claude plugin validate . --strict
          claude plugin validate .claude-plugin/plugin.json --strict
          claude plugin validate ./skills --strict
          claude plugin validate ./agents --strict

      - name: Validate the generated Claude Code profile plugin
        # build/claude-code/ is a standalone plugin root (its own
        # .claude-plugin/plugin.json, skills/, agents/, hooks/), committed
        # and checked for drift above — validated here as its own plugin,
        # the same way the portable one is validated above.
        run: |
          claude plugin validate ./build/claude-code --strict
          claude plugin validate ./build/claude-code/.claude-plugin/plugin.json --strict
          claude plugin validate ./build/claude-code/skills --strict

      - name: mcp-server library tests (mcp package absent — proves the boundary)
        run: python3 -m pytest mcp-server -q

      - name: Install mcp package
        run: pip install "mcp<2"

      - name: mcp-server tests (mcp package present — server test now runs)
        run: python3 -m pytest mcp-server -q
