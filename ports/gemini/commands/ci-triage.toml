description = "Fix a red build for the right reason — first failure, classify, reproduce locally, fix or quarantine"

prompt = """Triage the red build: {{args}}
(If no argument was given, take the latest failing run on this branch.)

1. READ: the FIRST failure in the run (later ones are cascade); the actual failing output, decisive line quoted. List what changed: the diff, plus what CI re-resolves (dependencies, images, runners).
2. CLASSIFY (one diagnostic rerun allowed, same commit, only if unsure): CODE BUG (deterministic, from the diff → debug protocol) · BROKEN TEST (expectation stale → fix the test, but prove the code right first) · FLAKE (same commit passes and fails → step 4) · INFRA (runner/disk/registry — rerun legitimate for this class only) · DRIFT (dependency resolved new → pin now, upgrade deliberately later).
3. REPRODUCE locally with the command CI ran (from the workflow file). Local-passes-CI-fails → diff the environments (versions, env vars, parallelism, timezone, test order). Prove the fix: the failing run passes, quoted.
4. FLAKES are real bugs (shared state, ordering, time, unawaited async, ports): stress-run if cheap; fix the root cause if affordable now; else quarantine WITH a ticket linked in the skip marker — a skip without a ticket is a deletion. Never sleeps or wider timeouts as the fix.
5. MAIN RED: fix forward only if minutes away, else revert first. Entangled commits → git bisect with the CI command. Never debug by pushing guess-commits.
6. Report: classification (evidence quoted) · root cause or quarantine ticket · fix + local verification · recurrence risk. Name infra failures as infra so reruns don't get normalized."""
