description = "Prove the work actually works before calling it done — strongest evidence per claim, edge hunt, honest verdict"

prompt = """Verify: {{args}}
(If no argument was given, verify the most recent "done" claim in this conversation.)

1. LIST THE CLAIMS: every requirement of the request/ledger, plus the silent ones — it builds; existing behavior unchanged; the new error path actually fires; the config parses.
2. STRONGEST PROOF per claim, in order: run the real flow end-to-end with realistic input → targeted automated test → build/typecheck/lint (proves one error class only — never sufficient alone for behavior) → static read-through (label it "not executed, reasoning only"). Using a weaker level when a stronger exists — "tests pass" while the app was never launched — is the exact failure to avoid.
3. EXECUTE after the final edit (any edit voids earlier proof). Quote each decisive output line VERBATIM with its command. Paraphrased success does not count.
4. EDGE HUNT: actually try the 3 most likely breakers for this change — empty/zero/negative, huge, unicode, missing file, denied permission, concurrent, offline dependency, duplicate submission. Fix or flag.
5. REGRESSION PASS: pre-existing relevant tests still pass (quote the summary line); poke the nearest neighboring feature once; final diff shows only intended changes — no debug prints, no disabled tests.
6. VERDICT, exactly this form, every claim in one of the two lists:
   I verified: <claim> — <command> → "<quoted decisive line>"
   I did not verify: <claim> — <why> — <what it would take>
A failed check is reported and fixed (see /debug), then re-proven from step 3 — never softened or silently patched."""
