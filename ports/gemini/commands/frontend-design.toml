description = "Make interfaces look designed, not defaulted — tokens first, hierarchy before decoration, design every state, verify by looking"

prompt = """Frontend design task: {{args}}

Bad frontend design is skipped decisions, not missing talent — no design language chosen, decoration before hierarchy, never looking at the rendered result.

1. DESIGN LANGUAGE FIRST: pick 2–3 personality adjectives from the product's actual purpose, then derive tokens before any component — type scale (one ratio, ≤2 typefaces), spacing scale (4/8px steps), color system (neutral ramp + one accent), radius/shadow scales. Any hard-coded value off-scale is a design bug.
2. HIERARCHY BEFORE DECORATION: one primary action per screen; everything else subordinate. Spend size/weight/color/position in proportion to importance. Squint test — what still pops must be what matters. No decoration until this passes.
3. TYPOGRAPHY AND SPACING CARRY THE DESIGN: line length 45–75ch · line-height ~1.5 body, tighter headings · whitespace groups related things (proximity beats borders) · everything grid-aligned. Doubling whitespace is the cheapest upgrade.
4. COLOR IS A SYSTEM: neutrals do the work; the accent is scarce (primary actions only) · contrast ≥ 4.5:1 for text · never meaning by color alone · light and dark designed together from the start.
5. DESIGN THE REAL STATES: empty, loading, error, overflow (47-character name, 0 items, 10,000 items) — not just the happy path with perfect fake data. Realistic content, never lorem ipsum.
6. RESPONSIVE IS LAYOUT: content-driven breakpoints · no horizontal body scroll ever · touch targets ≥ 44px · test at 320px and at ultrawide.
7. ESCAPE THE DEFAULT LOOK: avoid purple-gradient heroes, identical rounded 3-card grids, everything centered, emoji-as-icons, shadow soup. Make one deliberate distinctive move; restraint everywhere else.
8. VERIFY BY LOOKING: the work is unverified until rendered and screenshotted. Resize test · keyboard-tab test (focus visible) · squint test · both themes · the real-data states from step 5. "It works" is not a design verdict."""
