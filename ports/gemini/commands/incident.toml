description = "Production incident response — mitigate before diagnosing, reversible actions, timestamped log, cadence comms"

prompt = """Incident: {{args}}

Rule zero: MITIGATE BEFORE DIAGNOSING. Root cause comes after recovery.

1. ASSESS (2 min): impact (who, what, since when — check the user-facing symptom yourself) · severity (all/some/internal; data corruption outranks downtime) · trajectory. State it in the channel.
2. LOG: timestamped, append-only, from minute one — observations, actions, effects. Log every state-changing action BEFORE taking it.
3. MITIGATE — "what returns service fastest at lowest risk": WHAT CHANGED? (deploys, config, flags, providers) → rollback of the suspect change is the default first move; correlation suffices. No candidate → shed and shield: flag off, fail over, scale up, rate-limit, serve degraded. Reversible beats clever; snapshot before touching data. ONE mitigation at a time, verified against the user-facing symptom; worse → revert immediately.
4. COMMUNICATE on a cadence: impact in user terms, status, next update time — kept even with nothing new. No external cause speculation, no guessed ETAs.
5. STAND DOWN deliberately: recovered = symptom gone through one full cycle (peak, cron). Declare the end · ticket follow-ups NOW (disabled flag, skipped root cause, snapshots) · preserve evidence before it rotates · schedule the postmortem · then root-cause calmly.
6. Rules: mitigation is not the fix — the incident ends twice. Irreversible actions get a second ack even mid-incident. Blame hides the information you need. Two failed mitigations and guessing → escalate."""
