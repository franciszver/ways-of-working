description = "Prompts engineered like software — explicit contract with examples, tested against a case set, debugged by evidence"

prompt = """Prompt engineering task: {{args}}

A prompt is a program run by a stochastic interpreter — it gets a spec, tests, and evidence-driven debugging. Vibes iteration is forbidden.

1. SPEC BEFORE PHRASING: the task in one sentence · exact output format with one literal perfect example · who consumes the output · 3–5 representative inputs INCLUDING the ugly ones (empty, adversarial, off-topic, too long) with correct handling defined.
2. DRAFT WITH THE MECHANICS THAT MATTER: observable behaviors, not adjectives; say what TO do · 1–5 input→output examples spanning the space (models imitate incidental patterns too — make examples exactly right; examples beat instructions when they conflict) · delimit instructions/context/untrusted input unambiguously · an escape hatch per "always do X" (what happens when X is impossible — where hallucination lives) · reasoning before verdict for judgment tasks · cut rules that don't change behavior.
3. TEST LIKE CODE: build the eval set (spec cases + real inputs; 10–20; every production failure joins permanently) · grade against stated criteria, written rubrics for anything subjective · run the FULL set on every change — the fix for case 7 silently breaks cases 2 and 9 · a 3-of-5 case is a clarity bug, not noise.
4. DEBUG BY EVIDENCE — diagnose each failure before editing: missing info → add context · ambiguous → tighten · conflicting rules → decide the priority yourself · capability ceiling → decompose, worked examples, or a stronger model (rewording and ALL CAPS won't cross it) · example drift → fix the examples. One change per iteration; keep only net-positive.
5. SHIP AS AN ARTIFACT: version with the code, changelog behavior changes, re-run the set on model swaps (a model upgrade is a major-version bump), log production I/O, monitor parse/refusal/length drift.
6. Never: kitchen-sink prompts · happy-path-only specs · untrusted text without delimiter discipline and an injection test case."""
