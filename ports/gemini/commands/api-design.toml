description = "Design interfaces from the caller's side — sample calls first, explicit contract, evolution planned before v1"

prompt = """API design task: {{args}}

An API is a promise you can't unmake — every quirk becomes load-bearing.

1. CALLS FIRST: write 5–10 realistic call sites verbatim as the consumer would — including pagination loops, retry-after-failure, partial updates, error handling. Awkward call = wrong design; fix now. Then derive the interface that makes those calls true. Design for the named primary consumer.
2. PIN THE CONTRACT per operation: inputs (types, units, ranges, on-invalid) · outputs on success AND partial success · a branchable error taxonomy (machine code + human detail; caller-can-fix / retry / can't-help) · semantics (idempotency for every mutation, timeouts, pagination stability, concurrent updates) · empty-vs-absent-vs-null decided once, applied everywhere.
3. CONSISTENCY BEATS CLEVERNESS: one naming convention, casing, pagination scheme, error shape, timestamp format (ISO 8601 UTC), ID type; platform conventions followed straight. Novelty is a defect unless it pays for itself.
4. PLAN EVOLUTION BEFORE V1: smallest surface serving the step-1 calls — add later, never remove; in doubt, leave out · additive changes require consumers to ignore unknown fields — state it · pick the versioning mechanism and deprecation promise now.
5. REVIEW AS A ONE-WAY DOOR: replay each sample call against the final design · write the easiest misuse; make illegal states unrepresentable where possible · every error path has a defined shape · extending an existing API: its conventions win over your preferences.
6. Deliver: contract table · runnable sample calls · versioning + deprecation policy · explicit non-goals. Never: schema-outward design, mode-parameter god endpoints, booleans that will grow a third state, errors as parseable strings or 200-with-error-body."""
