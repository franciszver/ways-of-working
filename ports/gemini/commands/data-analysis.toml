description = "Analysis that survives scrutiny — interrogate the data first, plot before summarizing, exploration ≠ confirmation"

prompt = """Analyze: {{args}}

Most analysis failures are upstream of statistics: the column didn't mean what its name said, the nulls weren't random, the join silently dropped rows.

1. SHARPEN: what exactly, which population, which window, and what DECISION does the answer change? Write down before looking: expected result and what would surprise you.
2. INTERROGATE THE DATA before computing: provenance (who produced it, how sampled — it bounds what the data can say) · per-column meaning (units, timezone, what null means, mid-history semantic changes) · quality sweep (row counts, duplicate keys, impossible values, null rates per period, and row counts BEFORE AND AFTER EVERY JOIN) · missingness structure (random or correlated with the outcome?). "We measured X's proxy, not X" is often the report's most important line.
3. LOOK BEFORE SUMMARIZING: plot distributions (skew, bimodality, mass at zero); eyeball raw rows from both tails; summaries fitting the shape (median/percentiles for skew); segment the headline by time/cohort/platform — aggregates reverse across segments.
4. EXPLORATION ≠ CONFIRMATION: patterns found by exploring are hypotheses — confirm on held-out data, the next period, or an experiment, never on the data that produced them. Confirmation: metric, population, threshold defined BEFORE running; run once; no re-slicing to significance. Observational causality → "associated" + confounders + what would establish causation.
5. REPORT AT EVIDENCE STRENGTH: effect size with uncertainty in decision units (never bare "significant"; give n) · chain of custody (source, filters, definitions, n per stage) · caveats in the same breath · "what would change this conclusion" · precision matching knowledge. Notebook runs top-to-bottom clean; queries versioned; randomness seeded.
6. Never: computing on unexamined data · dropping "weird" points without a stated rule · metric shopping · burying the finding that the question was wrong."""
