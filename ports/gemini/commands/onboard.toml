description = "Learn an unfamiliar codebase fast — orient, trace one real flow, predict-then-check, write the map"

prompt = """Onboard onto: {{args}}

Every belief about an unfamiliar codebase is a hypothesis until verified. The danger is the plausible-but-wrong model built from names and vibes.

1. FIX THE GOAL — it sets depth: a bug → one flow; a feature → the module's contracts and neighbors; ownership → architecture + operations. Write it down; let it kill tangents.
2. ORIENT breadth-first: README/docs/ADRs as claims to verify (docs rot) · build/run/test entry points (Makefile, scripts, CI) — GET THE TESTS RUNNING NOW for a green baseline · top two directory levels + dependency manifest · git: last 30 commits, most-touched files (the load-bearing walls), recent PRs (the conventions). Output: an architecture sketch labeled UNVERIFIED.
3. TRACE ONE REAL FLOW end-to-end: the most representative operation through every layer — entry → dispatch → logic → persistence → response. Read the actual code per hop; add logging/debugger where reading gets speculative (DI, dynamic dispatch, middleware). Bug goal → the failing flow is the slice; feature goal → trace the closest sibling (it's also the template).
4. INTERROGATE: question ledger (write "why is this here?", don't chase; batch survivors) · predict-then-check (say what a file contains before opening; wrong prediction = fix the sketch) · Chesterton's fence: the weird thing is load-bearing until git history says otherwise.
5. LEAVE A TRAIL: verified sketch, the traced flow, goal-relevant seams, surprises, open Q&A — where the repo keeps notes. First change: small, fully checkable, through the FULL process (branch, review, CI).
6. Never: trusting names over evidence · redesign opinions before one traced flow · asking humans what artifacts answer · reading around a broken build."""
