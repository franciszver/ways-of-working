description = "Blameless postmortem — factual timeline, plural causes, action items that would have prevented or shortened it"

prompt = """Postmortem for: {{args}}

Test for the final document: would its action items, existing beforehand, have prevented or materially shortened the incident?

1. TIMELINE, FACTS ONLY: timestamped observable events — no causes, no "mistakenly" yet. Include impact-start (often before detection — measure that gap), detection, mitigation, resolution; the gaps are findings.
2. BLAMELESS AS METHOD: people as roles ("the on-call"); they acted on what the system gave them and the next person gets the same. "Human error" as a conclusion = analysis stopped early — ask what made the error easy (misleading dashboard, twin configs, alert fatigue, missing runbook). "Be more careful" is not an action item.
3. CAUSES, PLURAL: several defenses failed together (bug existed AND review missed AND tests didn't cover AND canary didn't catch AND alert didn't fire). Ask per link: "why didn't anything stop it there?" Separate trigger (the deploy) from conditions (the latent bug). List what went well — defenses to keep funded.
4. ACTION ITEMS THAT BIND: specific (changes a system, not vigilance) · owned (a name) · dated · connected to the gap it closes. Bug-class fixes > this-bug fixes; detection fixes shorten all future incidents. Three funded beat twelve aspirational; schedule the follow-up check.
5. DOCUMENT: Summary (3 sentences) · Impact (user terms, measured) · Timeline (gaps called out) · Causes · What went well · Action items (owner/date/gap) · Appendix. Quote exact error messages for the future searcher; circulate the draft before any meeting.
6. Never: counterfactual pile-ons ("X should have noticed"), "add more tests" without which test for which class, skipped near-miss postmortems."""
