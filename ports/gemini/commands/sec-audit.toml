description = "Security audit — exploitable findings only, with concrete exploit scenarios"

prompt = """Security-audit: {{args}}
(If no argument was given, audit the current diff plus its data paths.)

1. MAP: entry points of untrusted data (handlers, CLI, uploads, webhooks, consumers) · sensitive sinks (queries, exec, paths, eval/deserialize, auth decisions, logs) · secrets/PII locations. User-written data returning from the DB is still untrusted.
2. TRACE each entry point to its sinks — a grep hit is a candidate, not a finding; follow the value and its sanitization on EVERY path. Categories: injection (SQL/shell/path/template) · authz on every path, IDOR, JWT validation · unsafe deserialization/eval · hardcoded secrets, secrets in logs/errors, disabled TLS, weak tokens · PII in logs, verbose errors, over-wide responses · XSS/CSRF/SSRF where applicable.
3. EXCLUDE unless explicitly asked: DoS, rate limiting, missing hardening, theoretical races/timing, outdated-dependency CVEs (one "update X" line), memory safety in safe languages, test-only files, ReDoS.
4. GATE: every finding needs its exploit scenario — "attacker sends X → flows through Y unsanitized (file:line) → achieves Z". Traced fully → CONFIRMED; one untraceable link → PLAUSIBLE + what would confirm; no scenario → delete.
5. REPORT: "SEVERITY [CONFIRMED|PLAUSIBLE] path:line — vulnerability — exploit scenario — remediation". BLOCKER = directly exploitable; MAJOR = realistic preconditions; MINOR = contained. Remediation names the standard fix (parameterized queries, allowlists, framework escaping). Clean report lists entry points traced and categories checked.
6. Don't fix during the audit — report first. Committed secrets = rotate, not delete."""
