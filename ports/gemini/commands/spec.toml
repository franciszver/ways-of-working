description = "Turn a request into a numbered requirements ledger with acceptance criteria and non-goals"

prompt = """Produce a requirements ledger for: {{args}}
(If no argument was given, specify the most recent request in this conversation.)

1. Extract three kinds of requirements: EXPLICIT (stated — reread the request line by line), IMPLICIT (assumed: "add login" implies existing users still work), NEGATIVE (what must NOT change — regressions are violated negative requirements nobody wrote down).
2. Number and classify: MUST / SHOULD / WON'T. Write at least two WON'Ts — non-goals are the scope fence.
3. Per MUST, write an acceptance criterion a stranger could check: command + expected result, or concrete scenario + correct behavior. "Works correctly" is not a criterion. If you can't write one, the requirement isn't understood — read the codebase before asking.
4. List each ambiguity that changes the work. Cheap to reverse → pick a sensible default and record "assuming X; say the word if not". Expensive to undo (data model, public API, user-visible) → ask, batching all questions into one round.
5. Mark the riskiest assumption — the one that invalidates the most work if wrong; it gets probed first.
6. Output the ledger (write SPEC.md for sizable work; inline for small tasks). Keep statuses current as work proceeds; verification at the end walks this ledger."""
