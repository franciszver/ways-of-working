description = "Branch-to-merge hygiene — one concern per PR, narrative commits, risk-fronting description"

prompt = """Prepare for review: {{args}}
(If no argument was given, take the current branch.)

Optimize one variable: how cheaply the reviewer reconstructs and checks your reasoning.

1. ONE CONCERN PER PR: a feature, a fix, or a refactor — never "the feature plus a drive-by rename plus reformatting". Splits (and merge order): refactor-then-behave · mechanical-then-manual (the 400-line codemod apart from the 30 judgment lines) · expand-then-contract for migrations. A summary needing "also" = two PRs. Label generated files/lockfiles; aim <~400 changed judgment lines.
2. COMMITS AS NARRATIVE: each one buildable logical step (bisect lands on it); subject imperative; body = WHY (constraint, bug link, rejected alternative). Squash wip/fix-typo noise before review.
3. DESCRIPTION, front-loaded: what & why in 1–2 sentences before the solution (link the issue) · the approach + the rejected alternative · RISK & PROOF — what could break and the evidence it doesn't (tests added, verification quoted; the most-skipped, highest-value section) · a guided tour when the diff is nonlinear. Then self-review your own full diff as the reviewer; remove debug leftovers; run the suite.
4. REVIEW DIALOGUE: every comment answered — fixed (with commit) / pushback (with reasoning) / deferred (with ticket link). No force-push during review; response commits separate from new feature work. Reviewing others: approach before mechanics; blocking vs preference marked; turnaround is production work.
5. MERGE: green CI, resolved threads, up to date with base. Squash-merge → PR title/description become the commit; write them like it. Delete the branch.
6. Never: the 2,000-line "review this" · force-pushing over an in-progress review · "will fix in a follow-up" without the ticket · self-merging "trivial" changes."""
